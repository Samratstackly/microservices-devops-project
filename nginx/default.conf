server {
    listen 80;
    server_name _;

    location = /health {
        default_type application/json;
        return 200 '{"status":"healthy","service":"nginx-gateway"}';
    }

    location /health/users {
        rewrite ^/health/users$ /health break;
        proxy_pass http://user-service:3001;
    }

    location /health/products {
        rewrite ^/health/products$ /health break;
        proxy_pass http://product-service:3002;
    }

    location /health/orders {
        rewrite ^/health/orders$ /health break;
        proxy_pass http://order-service:3003;
    }

    location /users {
        proxy_pass http://user-service:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /products {
        proxy_pass http://product-service:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /orders {
        proxy_pass http://order-service:3003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
