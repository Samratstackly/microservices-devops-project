services:

  user-service:
    image: ${USER_IMAGE}
    container_name: user-service
    restart: unless-stopped
    expose:
      - "3001"
    networks:
      - microservices-network

  product-service:
    image: ${PRODUCT_IMAGE}
    container_name: product-service
    restart: unless-stopped
    expose:
      - "3002"
    networks:
      - microservices-network

  order-service:
    image: ${ORDER_IMAGE}
    container_name: order-service
    restart: unless-stopped
    expose:
      - "3003"
    networks:
      - microservices-network

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - user-service
      - product-service
      - order-service
    restart: unless-stopped
    networks:
      - microservices-network

networks:
  microservices-network:
    driver: bridge
